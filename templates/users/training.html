{% extends 'users/userbase.html' %}
{% block content %}
<style>
    /* Add glow effect for the card */
    .glow-card {
        box-shadow: 0 0 15px rgba(0, 150, 250, 0.8);
        transition: box-shadow 0.3s ease-in-out;
    }

    .glow-card:hover {
        box-shadow: 0 0 25px rgba(0, 150, 250, 1);
    }

    pre {
        background-color: #f8f9fa;
        padding: 10px;
        border-radius: 5px;
    }
</style>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <!-- Bootstrap Card with Glow Effect -->
            <div class="card glow-card">
                <div class="card-body">
                    <h1 class="card-title text-center">Training Results</h1>

                    <div class="card-text">
                        <p><strong>Accuracy:</strong> {{ accuracy }}</p>

                        <h2>Confusion Matrix</h2>
                        <pre>{{ conf_matrix }}</pre>

                        <h2>Classification Report</h2>
                        <pre>{{ class_report }}</pre>
                    </div>

                    <div class="text-center mt-4">
                        <a href="{% url 'prediction' %}" class="btn btn-primary btn-lg">Go to Prediction</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
