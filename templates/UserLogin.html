{%extends 'base.html'%}
{%load static%}
{%block contents%}
<style>
body {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
}

.glass-card {
    width: 100%;
    max-width: 420px;
    margin: 80px auto;
    padding: 40px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(15px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    color: white;
}

.glass-card h2 {
    text-align: center;
    margin-bottom: 30px;
    font-weight: 600;
}

.input-field {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 20px;
    border-radius: 10px;
    border: none;
    outline: none;
}

.login-btn {
    width: 100%;
    padding: 12px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s ease;
}

.login-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(0, 114, 255, 0.4);
}

.reset-btn {
    width: 50%;
    padding: 6px;
    margin-top: 15px;
    border-radius: 20px;
    border: none;
    background: #ff4d4d;
    color: white;
    font-size: 12px;
    cursor: pointer;
}

.reset-btn:hover {
    background: #cc0000;
}

.message-box {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
    color: #00ffcc;
}
</style>

<div class="glass-card">

    <h2>🔐 User Login</h2>

    <form action="{% url 'UserLoginCheck' %}" method="POST">
        {% csrf_token %}

        <input type="text"
               name="loginid"
               class="input-field"
               placeholder="Enter Login ID"
               required>

        <input type="password"
               name="pswd"
               class="input-field"
               placeholder="Enter Password"
               required>

        <button type="submit" class="login-btn">
            Login
        </button>

        <div style="text-align:center;">
            <button type="reset" class="reset-btn">
                Reset
            </button>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="message-box">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

    </form>

</div>

{%endblock%}
